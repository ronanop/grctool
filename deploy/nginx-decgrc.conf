# Nginx server block for ISO 27001 Compliance Portal
# 1. Copy to /etc/nginx/sites-available/decgrc
# 2. Edit server_name, root, and proxy pass paths
# 3. ln -s /etc/nginx/sites-available/decgrc /etc/nginx/sites-enabled/
# 4. certbot --nginx -d YOUR_DOMAIN  (then reload)
# 5. nginx -t && systemctl reload nginx

server {
    listen 80;
    server_name _;
    # Redirect HTTP to HTTPS after certbot (uncomment after SSL)
    # return 301 https://$server_name$request_uri;

    # Frontend static files (Vite build output)
    root /var/app/decgrc/frontend/dist;
    index index.html;
    location / {
        try_files $uri $uri/ /index.html;
    }

    # API proxy to FastAPI backend
    location /api {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }

    # Optional: larger timeouts for uploads
    location /api/v1/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        client_max_body_size 100M;
        proxy_connect_timeout 120s;
        proxy_send_timeout 120s;
        proxy_read_timeout 120s;
    }
}

# After running certbot, a second server { listen 443 ssl; ... } block will be added.
# Keep the same root and location blocks inside it.
